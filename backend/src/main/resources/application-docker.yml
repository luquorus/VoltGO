spring:
  datasource:
    # stringtype=unspecified allows Hibernate to send enums as strings to PostgreSQL custom enum types
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:voltgo}?stringtype=unspecified
    username: ${POSTGRES_USER:voltgo_user}
    password: ${POSTGRES_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        # Let Hibernate auto-detect PostgreSQL dialect
        # For PostGIS geometry types, Hibernate will use PostgreSQLDialect automatically
        format_sql: false
        use_sql_comments: false
  flyway:
    enabled: true
    validateMigrationNaming: false
    validate-on-migrate: false

  # Email configuration (SMTP)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      host: redis
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
      max-idle: 8
      min-idle: 0

# MinIO Configuration
minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}

# Application-specific settings
app:
  email:
    enabled: ${EMAIL_ENABLED:true}
    from-name: VoltGo

