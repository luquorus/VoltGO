spring:
  datasource:
    # stringtype=unspecified allows Hibernate to send enums as strings to PostgreSQL custom enum types
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:voltgo}?stringtype=unspecified
    username: ${POSTGRES_USER:voltgo_user}
    password: ${POSTGRES_PASSWORD:voltgo_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        # Let Hibernate auto-detect PostgreSQL dialect
        # For PostGIS geometry types, Hibernate will use PostgreSQLDialect automatically
        format_sql: true
        use_sql_comments: true
  flyway:
    enabled: true

  # Email configuration (SMTP)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
      max-idle: 8
      min-idle: 0

# MinIO - used for presigned URLs that clients (browsers, mobile) call directly
minio:
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}

# Application-specific email settings
app:
  email:
    enabled: ${EMAIL_ENABLED:false}
    from-name: VoltGo

