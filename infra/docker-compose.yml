version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: voltgo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voltgo}
      POSTGRES_USER: ${POSTGRES_USER:-voltgo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voltgo_user} -d ${POSTGRES_DB:-voltgo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voltgo-network

  redis:
    image: redis:7-alpine
    container_name: voltgo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voltgo-network

  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: voltgo-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - voltgo-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: voltgo-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_TOOL_OPTIONS: "-Dspring.main.banner-mode=log"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-voltgo}
      POSTGRES_USER: ${POSTGRES_USER:-voltgo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      MINIO_URL: ${MINIO_URL:-http://minio:9000}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://192.168.0.106:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-voltgo}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - voltgo-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  voltgo-network:
    driver: bridge
